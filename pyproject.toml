[project]
name = "mvplus-subtitle"
version = "0.1.5"
description = "Give a 115 cloud drive film a Chinese subtitle: download, local ASR, LLM translation, and a verified round-trip upload"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Singapo" }]
keywords = ["subtitle", "srt", "whisper", "translation", "115", "asr"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "p115sync",
    "p115client",
    "tqdm",
    "faster-whisper",
    "zhconv",
    "httpx",
    "numpy",
    "scipy",
    # The caption stage (aligned_asr/caption.py) runs under THIS interpreter and
    # imports nagisa, so it belongs here and not only in the aligner environment.
    "nagisa",
]

[project.optional-dependencies]
diarize = [
    "pyannote.audio>=4.0.0",
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "soundfile",
]

[project.scripts]
mvsub = "mvsub.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvsub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
